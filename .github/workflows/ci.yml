name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: CI complet (build, syntaxe, 115 suites, lint)
        run: npm run ci:full
        timeout-minutes: 30

  # Parcours critiques dans un vrai Chromium headless (noyau OCCT WebAssembly réel) :
  # ouverture d'Exemples/Axe.miniFusion, esquisse → extrusion, FAO → G-code.
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      - name: Tests navigateur
        run: npm run test:browser
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
