name: CI

# Lancement manuel seulement (onglet Actions › CI › Run workflow) : les tests tournent
# sur le PC de développement à chaque livraison (npm run ci:full, toutes les suites en
# parallèle), bien plus vite que sur les machines GitHub à 2 cœurs, et sans consommer
# le quota de bande passante LFS (1 Go par mois) à chaque push.
on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: CI complet (build, syntaxe, 115 suites, lint)
        run: npm run ci:full
        timeout-minutes: 30

  # Parcours critiques dans un vrai Chromium headless (noyau OCCT WebAssembly réel) :
  # ouverture d'Exemples/Axe.miniFusion, esquisse → extrusion, FAO → G-code.
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      # projet « gpu » exclu : les machines GitHub n'ont pas de carte graphique
      # (SwiftShader) — à lancer en local avec npm run test:gpu
      - name: Tests navigateur
        run: npm run test:browser -- --project=chromium
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
